{% extends "base.html" %}
{% block title %}{{ 'ახალი აუდიტორია' if mode == 'new' else 'რედაქტირება' }} — CU{% endblock %}
{% block content %}

<a class="back-link" href="{{ url_for('dashboard') if mode == 'new' else url_for('room_detail', room_id=room['id']) }}">← უკან</a>
<h1>{{ 'ახალი აუდიტორია' if mode == 'new' else room['code'] + ' — რედაქტირება' }}</h1>

<form method="post" class="room-form">
  <div class="form-grid">
    <label>სართული *
      <input type="text" name="floor" maxlength="2" value="{{ room['floor'] if room else '' }}" placeholder="მაგ: A, B, C, D" required>
    </label>
    <label>აუდიტორიის კოდი *
      <input type="text" name="code" value="{{ room['code'] if room else '' }}" placeholder="მაგ: A12" required>
    </label>
    <label>აქსეს პოინტი
      <input type="text" name="access_point" value="{{ room['access_point'] if room else '' }}">
    </label>
    <label>პროექტორი
      <input type="text" name="projector" value="{{ room['projector'] if room else '' }}">
    </label>
    <label>სმარტბორდი
      <input type="text" name="smartboard" value="{{ room['smartboard'] if room else '' }}">
    </label>
    <label>კომპიუტერი
      <input type="text" name="computer" value="{{ room['computer'] if room else '' }}">
    </label>
    <label>მონიტორი
      <input type="text" name="monitor" value="{{ room['monitor'] if room else '' }}">
    </label>
    <label>კამერა
      <input type="text" name="camera" value="{{ room['camera'] if room else '' }}">
    </label>
    <label>დინამიკი
      <input type="text" name="speaker" value="{{ room['speaker'] if room else '' }}">
    </label>
    <label class="wide">კომენტარი
      <textarea name="comment" rows="3">{{ room['comment'] if room else '' }}</textarea>
    </label>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn-primary">{{ 'დამატება' if mode == 'new' else 'შენახვა' }}</button>
    <a class="btn-secondary" href="{{ url_for('dashboard') if mode == 'new' else url_for('room_detail', room_id=room['id']) }}">გაუქმება</a>
  </div>
</form>

{% endblock %}

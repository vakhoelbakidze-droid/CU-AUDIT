{% extends "base.html" %}
{% block title %}შესვლა — CU აუდიტორიები{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-mark">CU</div>
    <h1>აუდიტორიების ინვენტარი</h1>
    <p class="login-sub">შედით სისტემაში აღჭურვილობის სამართავად</p>
    {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
    <form method="post">
      <label>მომხმარებელი
        <input type="text" name="username" autofocus required>
      </label>
      <label>პაროლი
        <input type="password" name="password" required>
      </label>
      <button type="submit" class="btn-primary">შესვლა</button>
    </form>
    <p class="login-hint">ნაგულისხმევი: <code>admin</code> / <code>admin123</code> — შესვლის შემდეგ შეცვალეთ ⚙ მენიუდან</p>
  </div>
</div>
{% endblock %}
